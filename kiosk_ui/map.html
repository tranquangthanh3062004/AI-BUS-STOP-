<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Bản đồ Trạm Xe Buýt Thông Minh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b8cff'/%3E%3Crect x='5' y='6' width='14' height='9' rx='2' fill='white'/%3E%3Ccircle cx='8.5' cy='17' r='1.6' fill='white'/%3E%3Ccircle cx='15.5' cy='17' r='1.6' fill='white'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="static/libs/leaflet.css" />
    <link rel="stylesheet" href="static/libs/leaflet-routing-machine.css" />

    <style>
        :root {
            --bg-base: #08090b;
            --panel: rgba(255, 255, 255, 0.05);
            --panel-solid: #101114;
            --accent: #5b8cff;
            --accent-2: #8b6bff;
            --text-1: #f4f4f6;
            --text-2: #9b9ba6;
            --border: rgba(255, 255, 255, 0.09);
            --shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg-base);
            color: var(--text-1);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #bus-map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
        }
        .leaflet-tile-pane {
            filter: grayscale(100%) invert(100%) contrast(90%) brightness(85%);
        }
        .leaflet-control-zoom a {
            background: var(--panel-solid) !important;
            color: var(--text-1) !important;
            border-color: var(--border) !important;
        }
        .leaflet-popup-content-wrapper {
            background: var(--panel-solid);
            color: var(--text-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .leaflet-popup-tip { background: var(--panel-solid); }
        .leaflet-popup-content b { font-family: 'Outfit', sans-serif; color: var(--accent); }

        /* Overlay chrome */
        .topbar {
            position: fixed;
            top: 18px; left: 18px; right: 18px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            pointer-events: none;
        }
        .brand {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px;
            box-shadow: var(--shadow);
        }
        .brand .logo {
            width: 30px; height: 30px; border-radius: 8px; flex: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
        }
        .brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand span {
            display: block;
            font-size: 11px;
            color: var(--text-2);
            font-family: 'JetBrains Mono', monospace;
        }

        .stop-count {
            pointer-events: auto;
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 9px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-2);
            box-shadow: var(--shadow);
            white-space: nowrap;
        }
        .stop-count b { color: var(--text-1); }

        .legend {
            position: fixed;
            left: 18px; bottom: 18px;
            z-index: 1000;
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: var(--shadow);
            font-size: 12px;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .legend .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(91,140,255,0.18);
            flex: none;
        }

        @media (max-width: 560px) {
            .topbar { flex-direction: column; align-items: stretch; }
            .brand h1 { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="bus-map"></div>

    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="12" rx="2.5"></rect><circle cx="8.5" cy="19.5" r="1.4" fill="white" stroke="none"></circle><circle cx="15.5" cy="19.5" r="1.4" fill="white" stroke="none"></circle></svg>
            </div>
            <div>
                <h1>Bản đồ Trạm Xe Buýt</h1>
                <span>Hà Nội · dữ liệu nội bộ</span>
            </div>
        </div>
        <div class="stop-count"><b id="stop-total">0</b> trạm đang hiển thị</div>
    </div>

    <div class="legend"><span class="dot"></span>Trạm xe buýt / trung chuyển chính</div>

    <script src="static/libs/leaflet.js"></script>
    <script>
        // Toạ độ các trạm/trung chuyển chính (Hà Nội)
        const STOPS_GEO = {
            "Mỹ Đình": [21.0285, 105.7782],
            "Cầu Giấy": [21.0362, 105.8015],
            "Bách Khoa": [21.0055, 105.8430],
            "Hồ Gươm": [21.0285, 105.8542],
            "Yên Nghĩa": [20.9575, 105.7485],
            "Giáp Bát": [20.9815, 105.8415],
            "Ga Cát Linh": [21.0275, 105.8285]
        };

        const map = L.map('bus-map', { zoomControl: false }).setView([21.0285, 105.8042], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap | Smart Bus Stop'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let count = 0;
        for (const [name, coords] of Object.entries(STOPS_GEO)) {
            L.marker(coords).addTo(map)
                .bindPopup(`<b>Trạm xe buýt ${name}</b><br>Trạm dừng / trung chuyển chính`);
            count++;
        }
        document.getElementById('stop-total').innerText = count;
    </script>
</body>
</html>
